<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NeuroX Finance</title>

<style>
:root{
--bg:#0a0a0a;
--glass:rgba(255,255,255,.06);
--accent:#ff6ec7;
--blue:#6fd3ff;
--radius:110px;
--item-h:48px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,sans-serif;
background:
radial-gradient(circle at 10% 10%,#1a1a2e,transparent),
radial-gradient(circle at 90% 90%,#2a0033,transparent),
var(--bg);
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
padding:30px 16px;
}

h1{
font-weight:300;
letter-spacing:3px;
margin-bottom:6px;
text-shadow:0 0 20px rgba(255,110,199,.6);
animation:glow 3s ease-in-out infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px rgba(255,110,199,.3);}
to{text-shadow:0 0 30px rgba(255,110,199,.9);}
}

.signature{
font-size:.8rem;
opacity:.6;
text-align:center;
margin-bottom:20px;
}

.card{
width:100%;
max-width:420px;
padding:18px;
border-radius:26px;
background:var(--glass);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.12);
box-shadow:0 20px 60px rgba(0,0,0,.7);
margin-bottom:18px;
animation:float 6s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-6px);}
}

.zen-picker{
max-height:220px;
overflow:auto;
margin-bottom:12px;
border:1px solid rgba(255,255,255,.12);
border-radius:14px;
padding:6px;
}

.wheel div{
padding:10px;
border-radius:10px;
cursor:pointer;
transition:.2s ease;
}

.wheel div.active,
.wheel div:hover{
background:rgba(255,255,255,.12);
}

input{
width:100%;
padding:14px;
margin-bottom:12px;
border-radius:16px;
border:1px solid rgba(255,255,255,.2);
background:#000;
color:#fff;
outline:none;
box-shadow:0 0 10px rgba(255,110,199,.3);
}

button{
width:100%;
padding:14px;
border:none;
border-radius:18px;
background:linear-gradient(45deg,#ff6ec7,#6fd3ff);
font-weight:700;
cursor:pointer;
color:#000;
}

button:active{transform:scale(.96);}

.list-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
border-radius:12px;
background:rgba(255,255,255,.05);
margin-bottom:6px;
gap:8px;
}

.actions button{
width:auto;
padding:6px 10px;
font-size:.8rem;
margin-left:4px;
}

canvas{
width:100%;
background:#000;
border-radius:20px;
margin-top:10px;
}
</style>
</head>

<body>

<h1>NeuroX Finance</h1>
<div class="signature">
NeuroX — Neuro: thần kinh, não bộ; X: đột phá → Trí tuệ não bộ vượt giới hạn
</div>

<div class="card">
<div class="zen-picker">
<div class="wheel" id="wheel"></div>
</div>

<input type="number" id="amt" placeholder="Số tiền">
<button onclick="addExpense()">Thêm chi tiêu</button>
</div>

<div class="card">
<div id="list"></div>
<canvas id="chart" width="380" height="180"></canvas>
</div>

<script>
let data=JSON.parse(localStorage.getItem("nx"))||[];

const cats=[
"🍱 Ăn uống","☕ Cafe","🛍️ Mua sắm","🚗 Di chuyển",
"🎮 Giải trí","📚 Học tập","💊 Sức khỏe","🏠 Nhà cửa","✍️ Khác"
];

const wheel=document.getElementById("wheel");
let selected=0;

cats.forEach((c,i)=>{
  const el=document.createElement("div");
  el.textContent=c;
  if(i===selected) el.classList.add('active');
  el.onclick=()=>{
    selected=i;
    document.querySelectorAll('#wheel div').forEach((node)=>node.classList.remove('active'));
    el.classList.add('active');
    clickSound();
  };
  wheel.appendChild(el);
});

function play(freq,type="sine"){
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  o.type=type;
  o.frequency.value=freq;
  o.connect(g);
  g.connect(ctx.destination);
  g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.15);
  o.start();
  o.stop(ctx.currentTime+.15);
}

const clickSound=()=>play(1000);
const addSound=()=>play(600,"triangle");
const delSound=()=>play(400,"square");

function addExpense(){
  const amt=parseFloat(document.getElementById("amt").value);
  if(!amt || amt<=0) return;
  data.push({cat:selected,amt});
  localStorage.setItem("nx",JSON.stringify(data));
  addSound();
  document.getElementById("amt").value='';
  render();
}

function del(i){
  data.splice(i,1);
  localStorage.setItem("nx",JSON.stringify(data));
  delSound();
  render();
}

function render(){
  const list=document.getElementById("list");
  list.innerHTML="";
  data.forEach((d,i)=>{
    const div=document.createElement("div");
    div.className="list-item";
    div.innerHTML=`
<span>${cats[d.cat]} — ${d.amt.toLocaleString('vi-VN')} ₫</span>
<div class="actions">
<button onclick="del(${i})">Xoá</button>
</div>`;
    list.appendChild(div);
  });
  draw();
}

function draw(){
  const canvas=document.getElementById("chart");
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,380,180);
  const totals={};
  data.forEach(d=>totals[d.cat]=(totals[d.cat]||0)+d.amt);
  const keys=Object.keys(totals);
  if(!keys.length)return;
  const max=Math.max(...Object.values(totals));
  keys.forEach((k,i)=>{
    const h=totals[k]/max*140;
    ctx.fillStyle=`hsl(${i*40},80%,60%)`;
    ctx.fillRect(30+i*40,160-h,26,h);
  });
}

render();
</script>

</body>
</html>
