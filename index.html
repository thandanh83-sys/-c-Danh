<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NeuroX Zen Interface</title>

<style>
:root{
--bg:#0a0a0a;
--glass:rgba(255,255,255,0.08);
--accent:#a29bfe;
--pink:#ff8fab;
--text:#f6f7ff;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:system-ui;
background:
radial-gradient(circle at 20% 20%,rgba(162,155,254,.25),transparent 40%),
radial-gradient(circle at 80% 80%,rgba(255,143,171,.25),transparent 40%),
var(--bg);
color:var(--text);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:32px;
}

.app{
width:900px;
display:grid;
gap:24px;
}

.card{
background:var(--glass);
border:1px solid rgba(255,255,255,.18);
border-radius:20px;
padding:24px;
backdrop-filter:blur(18px);
box-shadow:0 12px 40px rgba(0,0,0,.5);
transition:.3s ease-in-out;
position:relative;
overflow:hidden;
}

.card:hover{
transform:translateY(-4px);
box-shadow:0 20px 60px rgba(0,0,0,.7);
}

.card::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(120deg,rgba(162,155,254,.15),rgba(255,143,171,.1));
opacity:.6;
pointer-events:none;
}

h1{
font-size:3rem;
background:linear-gradient(120deg,var(--accent),var(--pink));
-webkit-background-clip:text;
color:transparent;
text-align:center;
}

.subtitle{
text-align:center;
opacity:.7;
margin-top:8px;
}

button{
padding:14px;
border-radius:14px;
border:none;
cursor:pointer;
font-weight:700;
color:#140f2a;
background:linear-gradient(135deg,var(--accent),var(--pink));
transition:.2s ease;
position:relative;
overflow:hidden;
}

button:hover{
transform:translateY(-2px);
filter:saturate(1.1);
}

.ripple{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,.4);
transform:scale(0);
animation:ripple .5s ease-out;
pointer-events:none;
}

@keyframes ripple{
to{transform:scale(3);opacity:0}
}

.glow{
animation:glow 4s ease-in-out infinite;
}

@keyframes glow{
0%,100%{box-shadow:0 0 0 rgba(162,155,254,.2)}
50%{box-shadow:0 0 30px rgba(162,155,254,.5)}
}

.status{
padding:16px;
border-radius:14px;
background:rgba(0,0,0,.35);
text-align:center;
font-weight:600;
}

@media (max-width: 960px){
  .app{width:100%}
  .card[style]{display:grid !important; grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="app">

<div class="card glow">
<h1>🧠 NeuroX</h1>
<p class="subtitle">Zen Logic Interface — Trải nghiệm nhận thức mượt ✨</p>
</div>

<div class="card">
<div class="status" id="status">
🌿 Hệ thống đang ở trạng thái bình tĩnh
</div>
</div>

<div class="card" style="display:flex;gap:16px">
<button onclick="action('success',event)">✨ Thành công</button>
<button onclick="action('warning',event)">⚠️ Cảnh báo</button>
<button onclick="action('reset',event)">🌙 Reset</button>
</div>

</div>

<script>
function ripple(e){
const btn=e.currentTarget;
const circle=document.createElement("span");
const rect=btn.getBoundingClientRect();
const size=Math.max(rect.width,rect.height);
circle.className="ripple";
circle.style.width=size+"px";
circle.style.height=size+"px";
circle.style.left=e.clientX-rect.left-size/2+"px";
circle.style.top=e.clientY-rect.top-size/2+"px";
btn.appendChild(circle);
setTimeout(()=>circle.remove(),500);
}

function action(type,e){
ripple(e);
const status=document.getElementById("status");

if(type==="success"){
status.textContent="🌸 Trạng thái thành công — hệ thống sáng lên";
status.style.border="1px solid #85f2c3";
}

if(type==="warning"){
status.textContent="⚠️ Cảnh báo mềm — điều chỉnh nhẹ";
status.style.border="1px solid #ffd166";
}

if(type==="reset"){
status.textContent="🌿 Trở lại trạng thái bình tĩnh";
status.style.border="none";
}
}
</script>

</body>
</html>
